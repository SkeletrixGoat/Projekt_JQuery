<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
    $(function(){
        
  const pytania = [
    {
        "pytanie": "Jaka jest stolica Francji?",
        "odpowiedzi": ["Berlin", "Paryż", "Madryt", "Rzym"],
        "poprawna_indeks": 1
    },
    {
        "pytanie": "Jaka jest stolica Niemiec?",
        "odpowiedzi": ["Monachium", "Hamburg", "Berlin", "Bonn"],
        "poprawna_indeks": 2
    },
    {
        "pytanie": "Jaka jest stolica Włoch?",
        "odpowiedzi": ["Rzym", "Mediolan", "Neapol", "Wenecja"],
        "poprawna_indeks": 0
    },
    {
        "pytanie": "Jaka jest stolica Hiszpanii?",
        "odpowiedzi": ["Barcelona", "Walencja", "Sewilla", "Madryt"],
        "poprawna_indeks": 3
    },
    {
        "pytanie": "Jaka jest stolica Portugalii?",
        "odpowiedzi": ["Porto", "Lizbona", "Braga", "Faro"],
        "poprawna_indeks": 1
    },
    {
        "pytanie": "Jaka jest stolica Norwegii?",
        "odpowiedzi": ["Bergen", "Trondheim", "Oslo", "Stavanger"],
        "poprawna_indeks": 2
    },
    {
        "pytanie": "Jaka jest stolica Szwecji?",
        "odpowiedzi": ["Sztokholm", "Göteborg", "Malmö", "Uppsala"],
        "poprawna_indeks": 0
    },
    {
        "pytanie": "Jaka jest stolica Finlandii?",
        "odpowiedzi": ["Turku", "Tampere", "Oulu", "Helsinki"],
        "poprawna_indeks": 3
    },
    {
        "pytanie": "Jaka jest stolica Grecji?",
        "odpowiedzi": ["Saloniki", "Ateny", "Patras", "Heraklion"],
        "poprawna_indeks": 1
    },
    {
        "pytanie": "Jaka jest stolica Czech?",
        "odpowiedzi": ["Brno", "Ostrawa", "Praga", "Pilzno"],
        "poprawna_indeks": 2
    },
    {
        "pytanie": "Jaka jest stolica Japonii?",
        "odpowiedzi": ["Tokio", "Kioto", "Osaka", "Hiroshima"],
        "poprawna_indeks": 0
    },
    {
        "pytanie": "Jaka jest stolica Chin?",
        "odpowiedzi": ["Szanghaj", "Hongkong", "Kanton", "Pekin"],
        "poprawna_indeks": 3
    },
    {
        "pytanie": "Jaka jest stolica Australii?",
        "odpowiedzi": ["Sydney", "Canberra", "Melbourne", "Perth"],
        "poprawna_indeks": 1
    },
    {
        "pytanie": "Jaka jest stolica Kanady?",
        "odpowiedzi": ["Toronto", "Vancouver", "Ottawa", "Montreal"],
        "poprawna_indeks": 2
    },
    {
        "pytanie": "Jaka jest stolica Brazylii?",
        "odpowiedzi": ["Brasília", "Rio de Janeiro", "São Paulo", "Salvador"],
        "poprawna_indeks": 0
    },
    {
        "pytanie": "Jaka jest stolica Argentyny?",
        "odpowiedzi": ["Cordoba", "Rosario", "Mendoza", "Buenos Aires"],
        "poprawna_indeks": 3
    },
    {
        "pytanie": "Jaka jest stolica Egiptu?",
        "odpowiedzi": ["Aleksandria", "Kair", "Giza", "Luksor"],
        "poprawna_indeks": 1
    },
    {
        "pytanie": "Jaka jest stolica Turcji?",
        "odpowiedzi": ["Stambuł", "Izmir", "Ankara", "Antalya"],
        "poprawna_indeks": 2
    },
    {
        "pytanie": "Jaka jest stolica Korei Południowej?",
        "odpowiedzi": ["Seul", "Busan", "Incheon", "Daegu"],
        "poprawna_indeks": 0
    },
    {
        "pytanie": "Jaka jest stolica Islandii?",
        "odpowiedzi": ["Akureyri", "Kópavogur", "Hafnarfjörður", "Reykjavík"],
        "poprawna_indeks": 3
    }
];

    
       let wylosowaneIndeksy = [];
let numerPytania = 0;
let wynik = 0;
let timer;
let czasPozostaly = 15;

function pokazPytanie(){

    if(numerPytania >= 10){

        clearInterval(timer);

        $("#polePytanie").prop("hidden", true);

        $("#poleWynik").prop("hidden", false);

        $("#wynik").text("Twój wynik: " + wynik + "/250");

        $("#licznikCzasu").text("0");
        $("#pasekCzasu").css("width", "0%");

        return;
    }

    let losowePytanie = pytania[wylosowaneIndeksy[numerPytania]];

    $("#polePytanie").text("");

    $("#polePytanie").append(
        "<h3>" + (numerPytania + 1) + ". " + losowePytanie.pytanie + "</h3>"
    );

    for(let j = 0; j < 4; j++){

        $("#polePytanie").append(
            "<div class='d-flex justify-content-center'>" +
            "<div class='text-start' style='font-size: 16px;'>" +
            "<label>" +
            "<input type='radio' name='odp' value='" + j + "'>" +
            " " + losowePytanie.odpowiedzi[j] +
            "</label>" +
            "</div>" +
            "</div>"
        );

    }

    let czas = 15;
    czasPozostaly = 15;

    $("#licznikCzasu").text(czas);

    $("#pasekCzasu").css("transition", "none");
    $("#pasekCzasu").css("width", "100%");

    timer = setInterval(function(){

        czas--;
        czasPozostaly--;

        $("#licznikCzasu").text(czas);

        $("#pasekCzasu").css("transition", "width 1s linear");
        $("#pasekCzasu").css("width", (czas / 15 * 100) + "%");

        if(czas <= 0){

            clearInterval(timer);

            numerPytania++;

            pokazPytanie();

        }

    }, 1000);

}


    $("#polePytanie").on("change", "input[name='odp']", function(){

        clearInterval(timer);

        let losowePytanie = pytania[wylosowaneIndeksy[numerPytania]];

        if(parseInt($(this).val()) == losowePytanie.poprawna_indeks){

            wynik += 10 + czasPozostaly;
 
        }else{
            $(this).parent().addClass("zle")
        }
        $("#polePytanie input[name='odp'][value='" + losowePytanie.poprawna_indeks + "']").parent().addClass("dobrze");
        setTimeout(function(){
           numerPytania++;

            pokazPytanie();

        }, 2000);
        

    });


    $("#przyciskLosuj").on("click", function(){

            clearInterval(timer);

            $(".active").prop("hidden", false); 

            $("#polePytanie").prop("hidden", false);
            $("#poleWynik").prop("hidden", true);

            wylosowaneIndeksy = [];

            numerPytania = 0;
            wynik = 0;




        for(let i = 0; i < 10; i++){

            let losowyIndeks = Math.floor(Math.random() * pytania.length);
            let powtorzenie = false;

            for(let j = 0; j < wylosowaneIndeksy.length; j++){

                if(wylosowaneIndeksy[j] == losowyIndeks){
                    powtorzenie = true;
                }

            }

            while(powtorzenie == true){

                losowyIndeks = Math.floor(Math.random() * pytania.length);
                powtorzenie = false;

                for(let j = 0; j < wylosowaneIndeksy.length; j++){

                    if(wylosowaneIndeksy[j] == losowyIndeks){
                        powtorzenie = true;
                    }

                }

            }

            wylosowaneIndeksy[i] = losowyIndeks;

        }

        pokazPytanie();

});


    
        
    });
    </script>
     <style>
            body { font-family: Arial, sans-serif; max-width: 640px; margin: 25px auto; }
            .dobrze { background-color: green; font-weight: bold; }
            .zle { background-color: red; font-weight: bold; }
        </style>
</head>
<body>

    <div class="container-fluid text-center">
        <button id="przyciskLosuj" class="btn btn-primary">Losuj pytanie</button>
        <br>
        <div class="container-fluid active" hidden>

            <div class="progress mt-3 mb-2" style="height: 10px;">
                <div id="pasekCzasu" class="progress-bar"
                    style="width: 100%; transition: width 1s linear;">
                </div>
            </div>

            <p>Pozostały czas: <span id="licznikCzasu">15</span> sekund</p>

            <div id="polePytanie"></div>

            <div id="poleWynik" hidden>
                <h2>Koniec quizu!</h2>
                <h3 id="wynik"></h3>
            </div>

    </div>

    </div>
    

      
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
</body>
</html>
